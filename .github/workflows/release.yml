name: Publish release to Maven Central

on:
  release:
    types: [ released ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.14). Defaults to the release tag, or the dispatched tag ref if run manually against a tag.'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Clean build directory
        run: ./gradlew clean

      - name: Resolve version
        id: resolve_version
        run: |
          set -euo pipefail
          # GitHub Releases are cut from tags created by generate-tag.yml
          # (format vX.Y.Z), so the tag itself is the source of truth for the version.
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          fi
          # github.event.release.tag_name is only populated for `release` events.
          # workflow_dispatch runs against a tag ref instead, so fall back to that.
          if [ -z "$VERSION" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            # Refuse to fall back to Configuration.kt's versionName: that silently
            # rebuilds an already-published version and Sonatype rejects the
            # duplicate deployment as "already exists".
            echo "::error::Could not resolve a version to publish (no version input, no release tag, and not run against a tag ref)." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The close/release tasks must run in the same Gradle invocation as the
      # upload: gradle-nexus.publish-plugin only tracks the created staging
      # repository's ID in memory for the current build, so a separate
      # ./gradlew call for closeAndReleaseSonatypeStagingRepository has no
      # record of it and fails with "Failed to calculate the value of task
      # ':closeSonatypeStagingRepository' property 'stagingRepositoryId'".
      - name: Build, upload, close and release artifacts
        run: ./gradlew publishReleasePublicationToSonatypeRepository closeAndReleaseSonatypeStagingRepository --no-daemon --no-parallel --stacktrace
        env:
          VERSION: ${{ steps.resolve_version.outputs.version }}
          ORG_GRADLE_PROJECT_nexusUserName: ${{ secrets.SONATYPE_NEXUS_USERNAME }}
          ORG_GRADLE_PROJECT_nexusPassword: ${{ secrets.SONATYPE_NEXUS_PASSWORD }}
          ORG_GRADLE_PROJECT_sonatypeStagingProfileId: ${{ secrets.SONATYPE_STAGING_PROFILE_ID }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGKEYID }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGKEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGPASSWORD }}
